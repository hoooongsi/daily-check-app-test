<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="퇴근확인" />
  <title>퇴근확인 기록</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-shell">

    <header class="app-header">
      <span class="header-icon">🏢</span>
      <h1>퇴근확인 기록</h1>
    </header>

    <main class="form-container">

  <div class="field-group">
        <label for="date">📅 날짜</label>
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="date" id="date" style="flex:1;" />
          <span id="dayLabel" style="color:#e94560; font-weight:bold; white-space:nowrap;"></span>
        </div>
      </div>

      <div class="field-group">
        <label for="time">🕐 퇴근시간</label>
        <input type="time" id="time" />
        <span id="dayLabel" style="margin-left:10px; color:#e94560; font-weight:bold;"></span>
      </div>

      <div class="field-group">
        <label for="memo">📝 메모</label>
        <input type="text" id="memo" placeholder="특이사항 입력 (선택)" />
      </div>

      <div class="field-group">
        <label>📷 사진</label>
        <div class="photo-area">
          <input type="file" id="photoInput" accept="image/*" />
          <label for="photoInput" class="photo-btn">사진 촬영 또는 선택</label>
          <div id="previewBox" class="preview-box hidden">
            <img id="previewImg" src="" alt="미리보기" />
            <button id="removePhoto" type="button">✕ 사진 제거</button>
          </div>
        </div>
      </div>

      <button id="submitBtn" class="submit-btn">
        <span id="btnText">📤 기록 저장 및 전송</span>
        <span id="btnSpinner" class="spinner hidden"></span>
      </button>

      <div id="resultMsg" class="result-msg hidden"></div>

    </main>

    <section class="pending-section">
      <h2>⏳ 미전송 기록 <span id="pendingCount" class="badge">0</span></h2>
      <p class="pending-desc">인터넷이 없을 때 저장된 기록입니다. 온라인 상태에서 재전송할 수 있습니다.</p>
      <div id="pendingList"></div>
      <button id="retryBtn" class="retry-btn hidden">🔄 미전송 기록 모두 재전송</button>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
